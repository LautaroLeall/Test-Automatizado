$kind: http-request
name: GET Obtener Detalle (ID de Mongo inválido)
description: |-
  Valida que el endpoint GET /api/publications/:id maneje correctamente un ObjectId de MongoDB con formato inválido.

  **Qué verifica:**

  - El servidor responde con HTTP `400 Bad Request` cuando se proporciona una cadena que no es un ObjectId válido (por ejemplo, `1234567890`) como ID.
      
  - El cuerpo de la respuesta contiene una propiedad `message` con el valor exacto `"ID inválido"`, confirmando que el backend valida el formato del ID antes de consultar la base de datos.
url: "{{baseUrl}}/api/publications/1234567890"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code es 400 Bad Request\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"El servidor detecta que el formato del ID no es de MongoDB\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    \r

      \    // Validamos la propiedad 'message'\r

      \    pm.expect(jsonData).to.have.property(\"message\");\r

      \    \r

      \    // Validamos el texto exacto del error\r

      \    pm.expect(jsonData.message).to.eql(\"ID inválido\"); \r

      });"
    language: text/javascript
order: 3000
